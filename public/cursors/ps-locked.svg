<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <defs>
    <filter id="glowLock" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="glowBadge" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <!-- padlock, upper-left, bold red glow -->
  <g filter="url(#glowLock)" opacity="0.95">
    <rect x="5" y="14" width="16" height="13" rx="2.4" fill="none" stroke="#fb7185" stroke-width="3.2"/>
    <path d="M8 14 v-4.2 a5 5 0 0 1 10 0 V14" fill="none" stroke="#fb7185" stroke-width="3.2"/>
  </g>
  <rect x="5" y="14" width="16" height="13" rx="2.4" fill="#05070d" stroke="#fda4af" stroke-width="1.7"/>
  <path d="M8 14 v-4.2 a5 5 0 0 1 10 0 V14" fill="none" stroke="#fda4af" stroke-width="1.7"/>
  <circle cx="13" cy="20" r="1.8" fill="#fda4af"/>
  <!-- small red "denied" badge, bottom-right -->
  <g filter="url(#glowBadge)" opacity="0.95">
    <rect x="23" y="24" width="15" height="15" rx="3" fill="none" stroke="#fb7185" stroke-width="2.6"/>
  </g>
  <rect x="23" y="24" width="15" height="15" rx="3" fill="#1a0a0d" stroke="#fda4af" stroke-width="1.5"/>
  <line x1="26.5" y1="27.5" x2="34.5" y2="35.5" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34.5" y1="27.5" x2="26.5" y2="35.5" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/>
</svg>
