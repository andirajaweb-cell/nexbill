plugins {
    id 'com.android.application'
}

android {
    namespace 'id.nexbill.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'id.nexbill.tv'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Kunci upload diisi lewat Android Studio (Build > Generate Signed App Bundle) atau
    // local.properties — tidak pernah di-commit. Lihat README.md.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sengaja tanpa dependensi: hanya framework Android (TvView, WebView, HttpURLConnection, org.json).
dependencies {
}
